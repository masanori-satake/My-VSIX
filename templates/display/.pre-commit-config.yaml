# ビルド入口（作品プロジェクト用ひな形）
# 実行: pre-commit run --all-files
repos:
  - repo: local
    hooks:
      - id: my-vsix-guards
        name: 機械ガード（約束チェック）
        entry: python tools/guards/check_all.py .
        language: system
        pass_filenames: false
      - id: my-vsix-syntax
        name: 構文チェック
        entry: node --check extension.js
        language: system
        files: ^extension\.js$
      # VSIX 化は Node を隔離環境で調達する hook として実行する（キット tools/build の実体化時に確定）
